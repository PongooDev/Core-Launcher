name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test --solution Core-Launcher.slnx -c Release
      - name: Publish
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v').Split('-')[0]
          dotnet publish src/Core.Launcher -c Release -o artifacts/publish -p:Version=$version
      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $flags = @('--title', "Core Launcher $tag", '--generate-notes')
          if ($tag.Contains('-')) { $flags += '--prerelease' }
          gh release create $tag artifacts/publish/CoreLauncher.exe @flags
